# Paste these location blocks inside the aaPanel website's Nginx server {} block.
# Keep both locations INTERNAL: direct browser requests must never access these paths.
# Adjust both absolute paths if APP_DIR or private storage differs from the default install.

location ^~ /_cloud_drive_private/ {
    internal;
    alias /www/wwwroot/test-cloud.pesonawifi.my.id-private/;
    autoindex off;
    disable_symlinks on;
}

location ^~ /_cloud_drive_preview/ {
    internal;
    alias /www/wwwroot/test-cloud.pesonawifi.my.id/app-src/writable/cache/office-preview/;
    autoindex off;
    disable_symlinks on;
}
